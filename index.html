    <!-- First paint before the JS bundle arrives (slow-connection audit, fix 1).
         The background matches theme-color and the default hero colorBack, so
         there is no navy-to-green jump. The dot field and headline show only
         when the visitor will land on the default Live hero; React replaces
         #shell on its first render. -->
    <style>
      html,body{background:#0A1714;margin:0}
      #shell{display:none;position:relative;min-height:100vh;overflow:hidden;font-family:Outfit,system-ui,sans-serif;color:#fff}
      .shell-live #shell{display:block}
      #shell .dots{position:absolute;inset:0 0 40% 0;background:radial-gradient(circle,#E6307A 30%,transparent 33%) 0 0/24px 24px;opacity:.55;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
      #shell h1{position:absolute;left:clamp(20px,4.5vw,64px);bottom:22vh;margin:0;font-size:clamp(40px,5.2vw,76px);line-height:1.02;letter-spacing:-.03em;font-weight:500;max-width:11ch}
      @media (prefers-reduced-data: reduce){#shell .dots{display:none}}
    </style>
    <script>
      try {
        // Same default as HeroLab: a first visit lands on Live only with
        // Save-Data or a slow connection (src/utils/network.ts).
        var c = navigator.connection || {}
        var lessData = c.saveData || /^(slow-2g|2g|3g)$/.test(c.effectiveType || '') || matchMedia('(prefers-reduced-data: reduce)').matches
        var view = localStorage.getItem('hero-lab-view-mode') || (lessData ? 'live' : 'templates')
        if (view === 'live' && !/[?&](hero|preset|template|scene|preview)=/.test(location.search))
          document.documentElement.classList.add('shell-live')
      } catch (e) {}
    </script>
