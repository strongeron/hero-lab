<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hero Lab — shader hero sections you can tune live</title>
    <meta
      name="description"
      content="A browser lab for hero sections: a dithering-shader background with a live control panel for every parameter, breakpoint previews, template artboards, and shareable URLs."
    />
    <meta name="author" content="Gleb Stroganov" />
    <meta name="theme-color" content="#0A1714" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- og:image and og:url must be absolute — relative paths are not resolved
         by most crawlers. Pinned to the showcase deploy, so the card still
         renders when the lab is embedded elsewhere. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hero-lab.netlify.app/" />
    <meta property="og:title" content="Hero Lab — shader hero sections you can tune live" />
    <meta
      property="og:description"
      content="Pick a hero, tune every shader parameter live, and share the exact look via URL."
    />
    <meta property="og:image" content="https://hero-lab.netlify.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@strongeron" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Special+Gothic+Expanded+One&family=Inter:wght@400;500;600&family=Fira+Mono:wght@400;500&family=Martian+Mono:wght@300&display=swap" rel="stylesheet" />
    <!-- First paint before the JS bundle arrives (slow-connection audit, fix 1).
         The background matches theme-color and the default hero colorBack, so
         there is no navy-to-green jump. The dot field and headline show only
         when the visitor will land on the default Live hero; React replaces
         #shell on its first render. -->
    <style>
      html,body{background:#0A1714;margin:0}
      #shell{display:none;position:relative;min-height:100vh;overflow:hidden;font-family:Outfit,system-ui,sans-serif;color:#fff}
      .shell-live #shell{display:block}
      #shell .dots{position:absolute;inset:0 0 40% 0;background:radial-gradient(circle,#E6307A 30%,transparent 33%) 0 0/24px 24px;opacity:.55;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
      #shell h1{position:absolute;left:clamp(20px,4.5vw,64px);bottom:22vh;margin:0;font-size:clamp(40px,5.2vw,76px);line-height:1.02;letter-spacing:-.03em;font-weight:500;max-width:11ch}
      @media (prefers-reduced-data: reduce){#shell .dots{display:none}}
    </style>
    <script>
      try {
        if (localStorage.getItem('hero-lab-view-mode') === 'live' && !/[?&](hero|preset|template|scene|preview)=/.test(location.search))
          document.documentElement.classList.add('shell-live')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div id="shell" aria-hidden="true"><div class="dots"></div><h1>Something broke. You should already know what.</h1></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
