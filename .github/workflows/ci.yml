name: CI

# Runs on pushes to main and on every PR, so a pull request is gated before its
# Netlify deploy preview is worth looking at. Deployment itself is NOT handled
# here — Netlify builds from its own repo webhook (deploy key + push /
# pull_request events). This workflow only decides whether the code is sound.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches netlify.toml's NODE_VERSION so CI cannot pass on a version
          # the deploy never uses. Vite 7 needs 20.19+ / 22.12+.
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck, build, token lint, design-system contracts and their
      # indexes: the same steps as `npm run check`, without the browser.
      - name: Check (no browser)
        run: npm run check:fast

  smoke:
    runs-on: ubuntu-latest
    # ponytail: non-blocking until the smoke suite has a green week on CI
    # runners (headless WebGL and rAF timing differ from a laptop). Then
    # remove continue-on-error so a failing smoke check blocks the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ubuntu-latest ships Google Chrome at /usr/bin/google-chrome, which
      # scripts/smoke.mjs finds on its own.
      - name: Smoke (headless Chrome)
        run: npm run smoke
